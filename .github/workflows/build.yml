name: Build FF Mod
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: Patch APK
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign apksigner wget unzip
          # FILL: Replace with a direct link to the Free Fire APK
          wget -O base.apk "https://example.com/freefire.apk" 
          
          apktool d base.apk -o out
          mkdir -p out/lib/arm64-v8a
          
          # FILL: You need to upload libmod.so to your repo
          # This step copies it into the decompiled APK
          # cp libs/arm64-v8a/libmod.so out/lib/arm64-v8a/
          
          apktool b out -o modded.apk
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore key.jks -storepass 123456 -alias key -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          zipalign -v 4 modded.apk aligned.apk
          apksigner sign --ks key.jks --ks-pass pass:123456 --out signed.apk aligned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: modded-apk
          path: signed.apk
